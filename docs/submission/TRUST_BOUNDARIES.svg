<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537e87"/></marker></defs><rect width="1440" height="1050" fill="#f3f6f8"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="13" fill="#537e87" font-weight="700">FINBRAIN / SUBMISSION FIGURE</text><text x="48" y="91" font-family="Arial, sans-serif" font-size="32" fill="#153b49" font-weight="700">Trust boundaries</text><text x="48" y="123" font-family="Arial, sans-serif" font-size="17" fill="#536778" font-weight="400">Authorization is enforced by backend code before source evidence is disclosed to an AI client.</text><rect x="40" y="154" width="1360" height="190" rx="18" fill="#eaf0f7" stroke="#b1c4d8" stroke-dasharray="8 5"/><text x="60" y="183" font-family="Arial, sans-serif" font-size="14" fill="#41607f" font-weight="700">A / EMPLOYEE-FACING CLIENTS — separate conversations and credentials</text><rect x="65" y="202" width="585" height="116" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="87" y="235" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Browser</text><text x="87" y="265" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Session cookie; fictional identity selection for demo</text><text x="87" y="289" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Switching identity clears the current web answer</text><rect x="790" y="202" width="585" height="116" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="812" y="235" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">WorkBuddy + model runtime</text><text x="812" y="265" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Bearer token via MCP; generated text is untrusted</text><text x="812" y="289" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Conversation memory remains outside FinBrain control</text><rect x="40" y="405" width="1360" height="337" rx="18" fill="#edf5f0" stroke="#9cbaa8" stroke-dasharray="8 5"/><text x="60" y="435" font-family="Arial, sans-serif" font-size="14" fill="#3f7057" font-weight="700">B / TRUSTED LOCAL BACKEND — logical application boundary, not a production sandbox</text><rect x="65" y="462" width="360" height="130" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="87" y="495" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Identity checks</text><text x="87" y="525" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Resolve session or token</text><text x="87" y="549" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Reject inactive accounts</text><text x="87" y="573" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Model cannot select a user ID</text><rect x="490" y="462" width="460" height="130" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="512" y="495" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Source authorization gate</text><text x="512" y="525" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Tenant, membership, resource restrictions</text><text x="512" y="549" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Temporary grants at current checkpoint</text><text x="512" y="573" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">No denied metadata in ordinary evidence</text><rect x="1015" y="462" width="360" height="130" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="1037" y="495" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Authorized output</text><text x="1037" y="525" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Only allowed evidence leaves</text><text x="1037" y="549" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Preview reads reauthorize</text><text x="1037" y="573" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">No full-corpus AI access</text><polyline points="355,318 355,378 245,378 245,462" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="1080,318 1080,365 280,365 280,462" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="425,525 490,525" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="950,525 1015,525" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="65" y="624" width="1310" height="90" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="87" y="657" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Controlled persistence / audit scope</text><text x="87" y="687" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Encrypted backend query/response records and decisions; metadata-only auditor UI; separate audit permission.</text><polyline points="720,592 720,624" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="48" y="786" width="602" height="140" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="70" y="819" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">C / Backend-only corpus and policies</text><text x="70" y="849" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Synthetic sources feed the authorization gate.</text><text x="70" y="873" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Same host: filesystem owners can access data and keys.</text><text x="70" y="897" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">HMAC logs have no independent external anchor.</text><polyline points="350,786 350,765 25,765 25,610 720,610 720,592" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="1375,525 1385,525 1385,380 1195,380 1195,318" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="790" y="786" width="602" height="140" rx="14" fill="#fff5e6" stroke="#dbbc88"/><text x="812" y="819" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Outside the enforced boundary</text><text x="812" y="849" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Previously disclosed or copied text cannot be recalled.</text><text x="812" y="873" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">WorkBuddy final answers are not automatically audited.</text><text x="812" y="897" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Use a fresh WorkBuddy chat when switching identities.</text><text x="48" y="968" font-family="Arial, sans-serif" font-size="17" fill="#536778" font-weight="400">Source retrieval and permissions are simulated. No SSO, live sync, or cross-client history deletion is claimed.</text><text x="48" y="1020" font-family="Arial, sans-serif" font-size="13" fill="#536778" font-weight="400">English prototype  |  16 October 2026  |  Arrows: data flow; dashed enclosures: logical trust boundaries</text> </svg>