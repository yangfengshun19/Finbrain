<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#537e87"/></marker></defs><rect width="1440" height="1050" fill="#f3f6f8"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="13" fill="#537e87" font-weight="700">FINBRAIN / SUBMISSION FIGURE</text><text x="48" y="91" font-family="Arial, sans-serif" font-size="32" fill="#153b49" font-weight="700">System architecture</text><text x="48" y="123" font-family="Arial, sans-serif" font-size="17" fill="#536778" font-weight="400">One local permission service supports the web experience and WorkBuddy tool calls.</text><rect x="48" y="164" width="400" height="125" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="70" y="197" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">React web application</text><text x="70" y="227" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Briefings, evidence Q&amp;A, timeline</text><text x="70" y="251" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Local review and scoped audit viewer</text><rect x="790" y="164" width="602" height="125" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="812" y="197" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">WorkBuddy AI client</text><text x="812" y="227" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Uses FinBrain tools to retrieve authorized evidence</text><text x="812" y="251" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Produces the final English synthesis in its own chat</text><rect x="790" y="345" width="602" height="115" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="812" y="378" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Local stdio MCP bridge</text><text x="812" y="408" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Six tools; identity comes from an employee-bound token</text><polyline points="1090,289 1090,345" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1105" y="323" font-family="Arial, sans-serif" font-size="14" fill="#355a65" font-weight="600">MCP stdio</text><rect x="48" y="345" width="602" height="115" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="70" y="378" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">FastAPI / loopback HTTP</text><text x="70" y="408" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Resolve cookie or bearer token; check active account</text><polyline points="248,289 248,345" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="265" y="323" font-family="Arial, sans-serif" font-size="14" fill="#355a65" font-weight="600">Session cookie</text><polyline points="790,403 650,403" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="663" y="385" font-family="Arial, sans-serif" font-size="14" fill="#355a65" font-weight="600">HTTP + token</text><rect x="48" y="518" width="602" height="160" rx="14" fill="#e7f2ed" stroke="#8cbda7"/><text x="70" y="551" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Current-permission retrieval</text><text x="70" y="581" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Rank internal candidates; apply source-specific rules</text><text x="70" y="605" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Assemble authorized evidence; recheck before release</text><text x="70" y="629" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Original source previews reauthorize every read</text><polyline points="349,460 349,518" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="790" y="518" width="602" height="160" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="812" y="551" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Backend-only synthetic sources</text><text x="812" y="581" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Confluence / Jira / Slack / Google Drive</text><text x="812" y="605" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">14 identities; 60 resource IDs; 15 checkpoints</text><text x="812" y="629" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">No live enterprise connectors</text><polyline points="790,595 650,595" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="665" y="578" font-family="Arial, sans-serif" font-size="14" fill="#355a65" font-weight="600">Policies + data</text><rect x="48" y="732" width="602" height="130" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="70" y="765" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Application services</text><text x="70" y="795" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Evidence excerpts, briefings, aggregates, reviewed drafts</text><text x="70" y="819" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Results return through the API to the requesting client</text><polyline points="349,678 349,732" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="365" y="712" font-family="Arial, sans-serif" font-size="14" fill="#355a65" font-weight="600">Authorized evidence only</text><rect x="790" y="732" width="602" height="130" rx="14" fill="#ffffff" stroke="#cfdae3"/><text x="812" y="765" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">SQLite and audit</text><text x="812" y="795" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Encrypted sensitive backend payloads and decisions</text><text x="812" y="819" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">HMAC chain; restricted PAY-042 metadata viewer</text><polyline points="650,799 790,799" fill="none" stroke="#537e87" stroke-width="2.4" marker-end="url(#arrow)"/><text x="685" y="780" font-family="Arial, sans-serif" font-size="14" fill="#355a65" font-weight="600">Record</text><rect x="48" y="895" width="1344" height="81" rx="14" fill="#fff5e6" stroke="#dbbc88"/><text x="70" y="928" font-family="Arial, sans-serif" font-size="19" fill="#153b49" font-weight="700">Not live: optional model adapter / future ADP integration</text><text x="70" y="958" font-family="Arial, sans-serif" font-size="16" fill="#536778" font-weight="400">Web answers remain excerpts. WorkBuddy final synthesis is not automatically stored in the backend audit.</text><text x="48" y="1020" font-family="Arial, sans-serif" font-size="13" fill="#536778" font-weight="400">English prototype  |  16 October 2026  |  Arrows: data flow; dashed enclosures: logical trust boundaries</text> </svg>